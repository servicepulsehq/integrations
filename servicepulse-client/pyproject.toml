[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servicepulse-client"
version = "0.1.0"
description = "Python client for ServicePulse Personal API (orchestrator gates, CI, scripts)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ServicePulse" }]
dependencies = ["httpx>=0.26,<1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/servicepulse_client"]
